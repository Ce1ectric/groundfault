name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"
    env:
      MPLBACKEND: Agg
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install groundfault with the dev extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install groundmeas for the cross-check of the unit spellings
        # groundmeas ≥ 1.6.1 (Python ≥ 3.14) is only on GitHub; without it the cross-check is skipped
        if: matrix.python-version == '3.14' && runner.os == 'Linux'
        run: python -m pip install "groundmeas @ git+https://github.com/Ce1ectric/groundmeas@v1.6.1"

      - name: Lint with ruff
        run: ruff check --output-format=github

      - name: Run the tests
        run: pytest -q

  minimum-versions:
    name: Lowest declared dependency versions (Python 3.10)
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install groundfault with the lowest declared versions of its direct dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system --resolution lowest-direct -e ".[dev]"

      - name: Run the tests
        run: pytest -q
