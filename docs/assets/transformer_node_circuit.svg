<svg xmlns="http://www.w3.org/2000/svg" width="680" height="314" viewBox="0 22 680 314" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Equivalent circuit of the transformer node per order and sequence</title>
  <desc>The HV network as a source U_bg behind Z_HV; the HV busbar with U_HV; the transformer Z_T up to the MV busbar
    with the busbar voltage U and the transformer current I; the MV network with its impedance Z_down, its own sources
    I_src and the earth fault as an additional branch. Z_up = Z_HV + Z_T = −ΔU/ΔI; U/I equals Z_down only without
    I_src.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3d3d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="336" fill="#ffffff"/>
  <g font-size="14" font-weight="bold" fill="#2c2c2a" text-anchor="middle">
    <text x="118" y="50">HV network</text>
    <text x="294" y="50">Transformer</text>
    <text x="541" y="50">MV network</text>
  </g>
  <g font-size="13" fill="#0f6e56" text-anchor="middle">
    <text x="222" y="82">U<tspan baseline-shift="sub" font-size="10">HV</tspan></text>
    <text x="372" y="82">I</text>
    <text x="420" y="82">U</text>
  </g>
  <g fill="none" stroke="#5f5e5a" stroke-width="1.2">
    <path d="M70 146 V110 H118"/>
    <path d="M190 110 H254"/>
    <path d="M334 110 H612 V146"/>
    <path d="M70 194 V230 H612 V212"/>
    <circle cx="70" cy="170" r="24"/>
    <path d="M470 110 V146"/>
    <path d="M470 194 V230"/>
    <path d="M545 110 V150"/>
    <circle cx="545" cy="170" r="20"/>
    <path d="M545 190 V230"/>
    <path d="M612 146 L628 168"/>
    <path d="M612 176 V182"/>
  </g>
  <circle cx="612" cy="174" r="2.5" fill="#5f5e5a"/>
  <g stroke="#2c2c2a" stroke-width="3.5">
    <line x1="222" y1="94" x2="222" y2="126"/>
    <line x1="420" y1="94" x2="420" y2="126"/>
  </g>
  <g fill="#f1efe8" stroke="#888780" stroke-width="0.8">
    <rect x="118" y="96" width="72" height="28" rx="4"/>
    <rect x="254" y="96" width="80" height="28" rx="4"/>
    <rect x="456" y="146" width="28" height="48" rx="4"/>
    <rect x="598" y="182" width="28" height="30" rx="4"/>
  </g>
  <g fill="none" stroke="#3d3d3a" stroke-width="1.5">
    <line x1="352" y1="97" x2="394" y2="97" marker-end="url(#arrow)"/>
    <line x1="545" y1="183" x2="545" y2="159" marker-end="url(#arrow)"/>
  </g>
  <g font-size="14" fill="#2c2c2a" text-anchor="middle">
    <text x="70" y="175">~</text>
    <text x="154" y="115">Z<tspan baseline-shift="sub" font-size="10">HV</tspan></text>
    <text x="294" y="115">Z<tspan baseline-shift="sub" font-size="10">T</tspan></text>
  </g>
  <g font-size="13" fill="#3d3d3a" text-anchor="middle">
    <text x="114" y="175">U<tspan baseline-shift="sub" font-size="10">bg</tspan></text>
    <text x="470" y="252">Z<tspan baseline-shift="sub" font-size="10">down</tspan></text>
    <text x="545" y="252">I<tspan baseline-shift="sub" font-size="10">src</tspan></text>
    <text x="612" y="252">Earth fault</text>
  </g>
  <g fill="none" stroke="#888780" stroke-width="0.8">
    <path d="M118 266 V274 H334 V266"/>
    <path d="M456 266 V274 H626 V266"/>
  </g>
  <g font-size="13" fill="#3d3d3a" text-anchor="middle">
    <text x="226" y="294">Z<tspan baseline-shift="sub" font-size="10">up</tspan> = Z<tspan baseline-shift="sub" font-size="10">HV</tspan> + Z<tspan baseline-shift="sub" font-size="10">T</tspan> = −ΔU/ΔI</text>
    <text x="541" y="294">U/I = Z<tspan baseline-shift="sub" font-size="10">down</tspan> only without I<tspan baseline-shift="sub" font-size="10">src</tspan></text>
  </g>
  <text x="40" y="322" font-size="12" fill="#0f6e56">teal: measured (U<tspan baseline-shift="sub" font-size="9">HV</tspan> only with HV voltages)</text>
</svg>
