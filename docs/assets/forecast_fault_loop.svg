  <rect x="110" y="92" width="50" height="24" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="0.8"/>
  <text x="135" y="108.68" font-size="13" fill="#3d3d3a" text-anchor="middle">Z<tspan dy="3.9" font-size="9">1</tspan></text>
  <path d="M160 104 H170" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <rect x="170" y="92" width="44" height="24" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="192" y="108.68" font-size="13" fill="#3d3d3a" text-anchor="middle">Z<tspan dy="3.9" font-size="9">1L</tspan></text>
  <path d="M214 104 H242" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="128" y="144" font-size="12" fill="#993c1d" text-anchor="middle">−p<tspan dy="3.6" font-size="9">1</tspan><tspan dy="-3.6">·U</tspan><tspan dy="3.6" font-size="9">1,pre</tspan></text>
  <rect x="240" y="40" width="196" height="120" rx="8" fill="none" stroke="#888780" stroke-width="0.9" stroke-dasharray="5 4"/>
  <text x="338" y="62" font-size="13" fill="#2c2c2a" text-anchor="middle" font-weight="bold">negative sequence</text>
  <path d="M224 104 H266" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <circle cx="282" cy="104" r="16" fill="#ffffff" stroke="#5f5e5a" stroke-width="1.3"/>
  <text x="282" y="109" font-size="15" fill="#5f5e5a" text-anchor="middle">~</text>
  <path d="M298 104 H320" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <rect x="320" y="92" width="50" height="24" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="0.8"/>
  <text x="345" y="108.68" font-size="13" fill="#3d3d3a" text-anchor="middle">Z<tspan dy="3.9" font-size="9">2</tspan></text>
  <path d="M370 104 H380" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <rect x="380" y="92" width="44" height="24" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/>
