<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Fault loop of a single-line-to-earth fault per harmonic order</title>
  <desc>The positive-, negative- and zero-sequence networks seen from the busbar are connected in series with three times the fault impedance; for a fault behind a line the series impedances of the line add to each sequence network. Below the reduced loop: source U_q + U_s, source impedance Z_q, the line contribution Z_qL and Z_F.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3d3d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="470" fill="#ffffff"/>
  <path d="M14 104 V290 H730 V254" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <rect x="30" y="40" width="196" height="120" rx="8" fill="none" stroke="#888780" stroke-width="0.9" stroke-dasharray="5 4"/>
  <text x="128" y="62" font-size="13" fill="#2c2c2a" text-anchor="middle" font-weight="bold">positive sequence</text>
  <path d="M14 104 H56" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <circle cx="72" cy="104" r="16" fill="#ffffff" stroke="#5f5e5a" stroke-width="1.3"/>
  <text x="72" y="109" font-size="15" fill="#5f5e5a" text-anchor="middle">~</text>
