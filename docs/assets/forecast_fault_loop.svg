  <circle cx="492" cy="104" r="16" fill="#ffffff" stroke="#5f5e5a" stroke-width="1.3"/>
  <text x="492" y="109" font-size="15" fill="#5f5e5a" text-anchor="middle">~</text>
  <path d="M508 104 H530" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <rect x="530" y="92" width="50" height="24" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="0.8"/>
  <text x="555" y="108.68" font-size="13" fill="#3d3d3a" text-anchor="middle">Z<tspan dy="3.9" font-size="9">0</tspan></text>
