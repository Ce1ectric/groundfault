  <path d="M424 104 H452" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="338" y="144" font-size="12" fill="#993c1d" text-anchor="middle">−p<tspan dy="3.6" font-size="9">2</tspan><tspan dy="-3.6">·U</tspan><tspan dy="3.6" font-size="9">2,pre</tspan></text>
  <rect x="450" y="40" width="196" height="120" rx="8" fill="none" stroke="#888780" stroke-width="0.9" stroke-dasharray="5 4"/>
  <text x="548" y="62" font-size="13" fill="#2c2c2a" text-anchor="middle" font-weight="bold">zero sequence</text>
