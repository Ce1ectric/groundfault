  <text x="612" y="108.68" font-size="13" fill="#3d3d3a" text-anchor="middle">Z<tspan dy="3.9" font-size="9">0L</tspan></text>
  <path d="M634 104 H662" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="548" y="144" font-size="12" fill="#993c1d" text-anchor="middle">−p<tspan dy="3.6" font-size="9">0</tspan><tspan dy="-3.6">·U</tspan><tspan dy="3.6" font-size="9">0,pre</tspan><tspan dy="-3.6"> + U</tspan><tspan dy="3.6" font-size="9">s</tspan></text>
  <path d="M662 104 H730 V202" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <rect x="716" y="202" width="28" height="52" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="0.8"/>
  <text x="730" y="233" font-size="12" fill="#3d3d3a" text-anchor="middle">3Z<tspan dy="3.6" font-size="9">F</tspan></text>
  <text x="708" y="232" font-size="12" fill="#2c2c2a" text-anchor="end" font-weight="bold">fault</text>
  <line x1="420" y1="290" x2="340" y2="290" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="380" y="282" font-size="13" fill="#3d3d3a" text-anchor="middle">I<tspan dy="3.9" font-size="9">F</tspan><tspan dy="-3.9">/3</tspan></text>
  <text x="450" y="182" font-size="11" fill="#888780" text-anchor="start">– – –  line (fault in the network)</text>
  <text x="30" y="336" font-size="13" fill="#2c2c2a" text-anchor="start" font-weight="bold">Reduced loop per order m</text>
  <path d="M90 386 V440 H360 V370" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <circle cx="90" cy="370" r="14" fill="#ffffff" stroke="#5f5e5a" stroke-width="1.3"/>
  <text x="90" y="375" font-size="15" fill="#5f5e5a" text-anchor="middle">~</text>
  <path d="M90 356 V352 H120" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <rect x="120" y="340" width="56" height="24" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="0.8"/>
  <text x="148" y="356.32" font-size="12" fill="#3d3d3a" text-anchor="middle">Z<tspan dy="3.6" font-size="9">q</tspan></text>
  <path d="M176 352 H192" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <rect x="192" y="340" width="56" height="24" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="220" y="356.32" font-size="12" fill="#3d3d3a" text-anchor="middle">Z<tspan dy="3.6" font-size="9">qL</tspan></text>
  <path d="M248 352 H264" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <rect x="264" y="340" width="56" height="24" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="0.8"/>
  <text x="292" y="356.32" font-size="12" fill="#3d3d3a" text-anchor="middle">Z<tspan dy="3.6" font-size="9">F</tspan></text>
  <path d="M320 352 H360 V370" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="66" y="368" font-size="12" fill="#993c1d" text-anchor="end">U<tspan dy="3.6" font-size="9">q</tspan></text>
  <text x="66" y="384" font-size="12" fill="#993c1d" text-anchor="end">+ U<tspan dy="3.6" font-size="9">s</tspan></text>
  <line x1="260" y1="440" x2="190" y2="440" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="225" y="432" font-size="12" fill="#3d3d3a" text-anchor="middle">I<tspan dy="3.6" font-size="9">F</tspan></text>
  <text x="400" y="360" font-size="13" fill="#3d3d3a" text-anchor="start">I<tspan dy="3.9" font-size="9">F</tspan><tspan dy="-3.9"> = (U</tspan><tspan dy="3.9" font-size="9">q</tspan><tspan dy="-3.9"> + U</tspan><tspan dy="3.9" font-size="9">s</tspan><tspan dy="-3.9">)/(Z</tspan><tspan dy="3.9" font-size="9">q</tspan><tspan dy="-3.9"> + Z</tspan><tspan dy="3.9" font-size="9">qL</tspan><tspan dy="-3.9"> + Z</tspan><tspan dy="3.9" font-size="9">F</tspan><tspan dy="-3.9">)</tspan></text>
  <text x="400" y="384" font-size="12" fill="#3d3d3a" text-anchor="start">Z<tspan dy="3.6" font-size="9">q</tspan><tspan dy="-3.6"> = (Z</tspan><tspan dy="3.6" font-size="9">0</tspan><tspan dy="-3.6"> + Z</tspan><tspan dy="3.6" font-size="9">1</tspan><tspan dy="-3.6"> + Z</tspan><tspan dy="3.6" font-size="9">2</tspan><tspan dy="-3.6">)/3,   Z</tspan><tspan dy="3.6" font-size="9">qL</tspan><tspan dy="-3.6"> = (2·Z</tspan><tspan dy="3.6" font-size="9">1L</tspan><tspan dy="-3.6"> + Z</tspan><tspan dy="3.6" font-size="9">0L</tspan><tspan dy="-3.6">)/3</tspan></text>
  <text x="400" y="406" font-size="12" fill="#3d3d3a" text-anchor="start">U<tspan dy="3.6" font-size="9">q</tspan><tspan dy="-3.6"> = −Σ p</tspan><tspan dy="3.6" font-size="9">k</tspan><tspan dy="-3.6">·U</tspan><tspan dy="3.6" font-size="9">k,pre</tspan><tspan dy="-3.6">   (pre-fault voltage of the faulted phase)</tspan></text>
  <text x="400" y="430" font-size="11" fill="#993c1d" text-anchor="start">U<tspan dy="3.3" font-size="8">s</tspan><tspan dy="-3.3">: source that arises with the fault</tspan></text>
  <text x="400" y="446" font-size="11" fill="#993c1d" text-anchor="start">(zero sequence: coils, VTs, earthing transformers)</text>
</svg>
