  <text x="390" y="296" font-size="13" fill="#3d3d3a" text-anchor="middle">Z<tspan dy="3.9" font-size="9">k</tspan><tspan dy="-3.9"> = Z</tspan><tspan dy="3.9" font-size="9">up</tspan><tspan dy="-3.9"> ∥ Z</tspan><tspan dy="3.9" font-size="9">down</tspan><tspan dy="-3.9">   (k = 1, 2)</tspan></text>
  <text x="390" y="318" font-size="11" fill="#3d3d3a" text-anchor="middle">parallel resonances: HV network m<tspan dy="3.3" font-size="8">p</tspan><tspan dy="-3.3"> ≈ √(X</tspan><tspan dy="3.3" font-size="8">C,HV,1</tspan><tspan dy="-3.3">/X</tspan><tspan dy="3.3" font-size="8">Q,1</tspan><tspan dy="-3.3">), MV busbar m</tspan><tspan dy="3.3" font-size="8">r</tspan><tspan dy="-3.3"> ≈ √(X</tspan><tspan dy="3.3" font-size="8">C,1</tspan><tspan dy="-3.3">/X</tspan><tspan dy="3.3" font-size="8">up,1</tspan><tspan dy="-3.3">)</tspan></text>
  <text x="20" y="350" font-size="13" fill="#2c2c2a" text-anchor="start" font-weight="bold">(b) zero sequence</text>
