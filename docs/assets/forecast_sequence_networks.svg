<svg xmlns="http://www.w3.org/2000/svg" width="780" height="540" viewBox="0 0 780 540" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>What the sequence impedances at the busbar contain</title>
  <desc>Positive and negative sequence: the upstream impedance Z_up of transformer and HV network (network feeder Z_Q in parallel with the capacitance and the loads of the HV network) in parallel with the MV network Z_down (cable capacitance, loads, harmonic sources). Zero sequence: earth capacitances, partly behind the series impedance of long feeders, losses, Petersen coils with a nonlinear part and further nonlinear paths such as voltage transformers.</desc>
