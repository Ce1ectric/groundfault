  <text x="200" y="266" font-size="11" fill="#3d3d3a" text-anchor="middle">Z<tspan dy="3.3" font-size="8">HV</tspan><tspan dy="-3.3"> = Z</tspan><tspan dy="3.3" font-size="8">Q</tspan><tspan dy="-3.3"> ∥ C</tspan><tspan dy="3.3" font-size="8">HV</tspan><tspan dy="-3.3"> ∥ loads</tspan></text>
