<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Upstream impedance: transformer and HV network at the harmonic orders</title>
  <desc>Seen from the MV busbar the transformer Z_T lies in series with the HV network: the line to the EHV/HV substation, the capacitance and the loads of the HV network at its busbar, the EHV feed with the background source, and a parallel path of a meshed network. Below the voltage divider that splits the measured upstream impedance with the HV voltages.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3d3d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="500" fill="#ffffff"/>
  <text x="20" y="28" font-size="13" fill="#2c2c2a" text-anchor="start" font-weight="bold">(a) Model of the HV network (positive and negative sequence, order m)</text>
  <line x1="50" y1="86" x2="50" y2="138" stroke="#2c2c2a" stroke-width="3.5"/>
  <text x="20" y="76" font-size="11" fill="#2c2c2a" text-anchor="start">MV busbar</text>
  <text x="50" y="158" font-size="11" fill="#0f6e56" text-anchor="middle">U<tspan dy="3.3" font-size="8">MV</tspan></text>
  <path d="M50 112 H104" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <ellipse cx="80" cy="112" rx="3.85" ry="7" fill="none" stroke="#0f6e56" stroke-width="1.6"/>
  <text x="80" y="98" font-size="11" fill="#0f6e56" text-anchor="middle">I<tspan dy="3.3" font-size="8">T</tspan></text>
  <rect x="104" y="100" width="60" height="24" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="0.8"/>
  <text x="134" y="116.68" font-size="13" fill="#3d3d3a" text-anchor="middle">Z<tspan dy="3.9" font-size="9">T</tspan></text>
  <text x="134" y="142" font-size="11" fill="#3d3d3a" text-anchor="middle">transformer</text>
  <path d="M164 112 H250" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <line x1="200" y1="86" x2="200" y2="138" stroke="#2c2c2a" stroke-width="3.5"/>
  <text x="200" y="76" font-size="11" fill="#2c2c2a" text-anchor="middle">HV busbar</text>
  <text x="200" y="158" font-size="11" fill="#0f6e56" text-anchor="middle">U<tspan dy="3.3" font-size="8">HV</tspan></text>
  <rect x="250" y="100" width="84" height="24" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="0.8"/>
  <text x="292" y="116.68" font-size="13" fill="#3d3d3a" text-anchor="middle">Z<tspan dy="3.9" font-size="9">L</tspan></text>
  <text x="298" y="142" font-size="10" fill="#3d3d3a" text-anchor="middle">line to the EHV/HV substation</text>
  <text x="298" y="156" font-size="10" fill="#3d3d3a" text-anchor="middle">R<tspan dy="3" font-size="8">1</tspan><tspan dy="-3"> + j·m·X</tspan><tspan dy="3" font-size="8">1</tspan></text>
  <path d="M334 112 H530" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <line x1="390" y1="86" x2="390" y2="138" stroke="#2c2c2a" stroke-width="3.5"/>
  <text x="390" y="76" font-size="11" fill="#2c2c2a" text-anchor="middle">EHV/HV busbar</text>
  <circle cx="425" cy="112" r="2.6" fill="#5f5e5a"/>
  <path d="M425 112 V152" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M414 155 H436 M414 161 H436" fill="none" stroke="#2c2c2a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M425 164 V246" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="441" y="162" font-size="11" fill="#3d3d3a" text-anchor="start">C<tspan dy="3.3" font-size="8">B</tspan></text>
  <circle cx="475" cy="112" r="2.6" fill="#5f5e5a"/>
  <path d="M475 112 V138" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <rect x="463" y="138" width="24" height="40" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="0.8"/>
  <text x="495" y="162" font-size="11" fill="#3d3d3a" text-anchor="start">G<tspan dy="3.3" font-size="8">B</tspan></text>
  <path d="M475 178 V246" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="486" y="222" font-size="10" fill="#3d3d3a" text-anchor="start">C<tspan dy="3" font-size="8">B</tspan><tspan dy="-3">: capacitance of the HV network</tspan></text>
  <text x="486" y="236" font-size="10" fill="#3d3d3a" text-anchor="start">G<tspan dy="3" font-size="8">B</tspan><tspan dy="-3">: loads, other MV networks</tspan></text>
  <rect x="530" y="100" width="80" height="24" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="0.8"/>
  <text x="570" y="116.68" font-size="13" fill="#3d3d3a" text-anchor="middle">Z<tspan dy="3.9" font-size="9">EHV</tspan></text>
  <text x="570" y="92" font-size="11" fill="#3d3d3a" text-anchor="middle">EHV feed</text>
  <path d="M610 112 H690 V158" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <circle cx="690" cy="174" r="16" fill="#ffffff" stroke="#5f5e5a" stroke-width="1.3"/>
  <text x="690" y="179" font-size="15" fill="#5f5e5a" text-anchor="middle">~</text>
  <text x="712" y="170" font-size="11" fill="#993c1d" text-anchor="start">U<tspan dy="3.3" font-size="8">bg</tspan></text>
  <text x="712" y="186" font-size="10" fill="#993c1d" text-anchor="start">(background)</text>
  <path d="M690 190 V246 H50 V138" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <circle cx="212" cy="112" r="2.6" fill="#5f5e5a"/>
  <path d="M212 112 V182 H300" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-dasharray="4 3" stroke-linejoin="round"/>
  <rect x="300" y="170" width="70" height="24" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="335" y="186.68" font-size="13" fill="#3d3d3a" text-anchor="middle">Z<tspan dy="3.9" font-size="9">P</tspan></text>
  <path d="M370 182 H660 V112" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-dasharray="4 3" stroke-linejoin="round"/>
  <circle cx="660" cy="112" r="2.6" fill="#5f5e5a"/>
  <text x="486" y="200" font-size="10" fill="#3d3d3a" text-anchor="start">Z<tspan dy="3" font-size="8">P</tspan><tspan dy="-3">: parallel path (meshed network)</tspan></text>
  <path d="M104 262 V270 H164 V262" fill="none" stroke="#888780" stroke-width="0.8" stroke-linejoin="round"/>
  <text x="134" y="286" font-size="12" fill="#3d3d3a" text-anchor="middle">Z<tspan dy="3.6" font-size="9">T</tspan></text>
  <path d="M200 262 V270 H700 V262" fill="none" stroke="#888780" stroke-width="0.8" stroke-linejoin="round"/>
  <text x="450" y="286" font-size="12" fill="#3d3d3a" text-anchor="middle">Z<tspan dy="3.6" font-size="9">HV</tspan></text>
  <text x="20" y="316" font-size="12" fill="#3d3d3a" text-anchor="start">Z<tspan dy="3.6" font-size="9">up,m</tspan><tspan dy="-3.6"> = Z</tspan><tspan dy="3.6" font-size="9">T,m</tspan><tspan dy="-3.6"> + Z</tspan><tspan dy="3.6" font-size="9">HV,m</tspan><tspan dy="-3.6">;  Z</tspan><tspan dy="3.6" font-size="9">HV,m</tspan><tspan dy="-3.6"> = [(Z</tspan><tspan dy="3.6" font-size="9">L,m</tspan><tspan dy="-3.6"> + Z</tspan><tspan dy="3.6" font-size="9">B,m</tspan><tspan dy="-3.6">)</tspan><tspan dy="-4.8" font-size="9">-1</tspan><tspan dy="4.8"> + Z</tspan><tspan dy="3.6" font-size="9">P,m</tspan><tspan dy="-8.4" font-size="9">-1</tspan><tspan dy="4.8">]</tspan><tspan dy="-4.8" font-size="9">-1</tspan></text>
  <text x="20" y="338" font-size="12" fill="#3d3d3a" text-anchor="start">Z<tspan dy="3.6" font-size="9">B,m</tspan><tspan dy="-3.6"> = (Z</tspan><tspan dy="3.6" font-size="9">EHV,m</tspan><tspan dy="-8.4" font-size="9">-1</tspan><tspan dy="4.8"> + j·m·ω·C</tspan><tspan dy="3.6" font-size="9">B</tspan><tspan dy="-3.6"> + G</tspan><tspan dy="3.6" font-size="9">B</tspan><tspan dy="-3.6">)</tspan><tspan dy="-4.8" font-size="9">-1</tspan><tspan dy="4.8">;  parallel resonance m</tspan><tspan dy="3.6" font-size="9">p</tspan><tspan dy="-3.6"> ≈ (ω·C</tspan><tspan dy="3.6" font-size="9">B</tspan><tspan dy="-3.6">·X</tspan><tspan dy="3.6" font-size="9">EHV,1</tspan><tspan dy="-3.6">)</tspan><tspan dy="-4.8" font-size="9">-1/2</tspan></text>
  <text x="20" y="376" font-size="13" fill="#2c2c2a" text-anchor="start" font-weight="bold">(b) Split with the HV voltages of the same recording (voltage divider)</text>
  <text x="20" y="400" font-size="12" fill="#3d3d3a" text-anchor="start">k<tspan dy="3.6" font-size="9">m</tspan><tspan dy="-3.6"> = t</tspan><tspan dy="3.6" font-size="9">s</tspan><tspan dy="-3.6">·ΔU</tspan><tspan dy="3.6" font-size="9">HV,s,m</tspan><tspan dy="-3.6">/ΔU</tspan><tspan dy="3.6" font-size="9">MV,s,m</tspan><tspan dy="-3.6"> = Z</tspan><tspan dy="3.6" font-size="9">HV,m</tspan><tspan dy="-3.6">/(Z</tspan><tspan dy="3.6" font-size="9">T,m</tspan><tspan dy="-3.6"> + Z</tspan><tspan dy="3.6" font-size="9">HV,m</tspan><tspan dy="-3.6">)</tspan></text>
  <text x="20" y="422" font-size="12" fill="#3d3d3a" text-anchor="start">Z<tspan dy="3.6" font-size="9">HV,m</tspan><tspan dy="-3.6"> = k</tspan><tspan dy="3.6" font-size="9">m</tspan><tspan dy="-3.6">·Z</tspan><tspan dy="3.6" font-size="9">up,m</tspan><tspan dy="-3.6">;  Z</tspan><tspan dy="3.6" font-size="9">T,m</tspan><tspan dy="-3.6"> = (1 − k</tspan><tspan dy="3.6" font-size="9">m</tspan><tspan dy="-3.6">)·Z</tspan><tspan dy="3.6" font-size="9">up,m</tspan></text>
  <text x="20" y="446" font-size="11" fill="#3d3d3a" text-anchor="start">t<tspan dy="3.3" font-size="8">s</tspan><tspan dy="-3.3">: ratio HV → MV with the vector group, from the 50-Hz positive sequence (negative sequence: conjugate phase shift)</tspan></text>
  <text x="20" y="464" font-size="11" fill="#0f6e56" text-anchor="start">k needs only the voltages of one recording – no transformer current, no second recorder</text>
</svg>
