<svg xmlns="http://www.w3.org/2000/svg" width="780" height="520" viewBox="0 0 780 520" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Node rule of the zero sequence with the coil currents</title>
  <desc>One loop: the fault current flows from earth through the fault impedance Z_F into the faulted phase, along the line, through the positive and negative sequence with the source U_q to the neutral point, and from there back to earth through the admittance of the network without the coils and through the coils. These two lie in parallel with each other and together in series with Z_F. The zero-sequence voltage lies across the parallel connection, and the fault current is the sum of its branch currents. Without coils and without earth admittance the loop is open: no fault current flows, however small Z_F.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3d3d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="520" fill="#ffffff"/>
  <path d="M80 192 V62" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M80 62 H150" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <circle cx="80" cy="127" r="16" fill="#ffffff" stroke="#5f5e5a" stroke-width="1.3"/>
  <text x="80" y="132" font-size="15" fill="#5f5e5a" text-anchor="middle">~</text>
  <text x="58" y="132" font-size="13" fill="#993c1d" text-anchor="end">U<tspan dy="3.9" font-size="9">q</tspan></text>
  <rect x="150" y="50" width="112" height="24" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="0.8"/>
  <text x="206" y="66.32" font-size="12" fill="#3d3d3a" text-anchor="middle">(Z<tspan dy="3.6" font-size="9">1</tspan><tspan dy="-3.6"> + Z</tspan><tspan dy="3.6" font-size="9">2</tspan><tspan dy="-3.6">)/3</tspan></text>
  <text x="206" y="92" font-size="11" fill="#3d3d3a" text-anchor="middle">positive + negative sequence</text>
  <path d="M262 62 H380" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <rect x="380" y="50" width="64" height="24" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="412" y="66.32" font-size="12" fill="#3d3d3a" text-anchor="middle">Z<tspan dy="3.6" font-size="9">qL</tspan></text>
  <text x="412" y="92" font-size="11" fill="#888780" text-anchor="middle">line (fault in the network)</text>
  <path d="M444 62 H690" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="520" y="52" font-size="11" fill="#2c2c2a" text-anchor="middle">faulted phase</text>
  <circle cx="690" cy="62" r="2.6" fill="#5f5e5a"/>
  <text x="682" y="52" font-size="11" fill="#2c2c2a" text-anchor="end" font-weight="bold">fault location F</text>
  <path d="M690 62 V150" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <rect x="676" y="150" width="28" height="46" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="0.8"/>
  <text x="712" y="178" font-size="13" fill="#3d3d3a" text-anchor="start">Z<tspan dy="3.9" font-size="9">F</tspan></text>
  <path d="M690 196 V312" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <line x1="668" y1="290" x2="668" y2="230" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="264" font-size="13" fill="#3d3d3a" text-anchor="end">I<tspan dy="3.9" font-size="9">F</tspan></text>
  <path d="M190 312 H690" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M600 312 V316" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M589 316 H611 M593 320 H607 M597 324 H603" fill="none" stroke="#5f5e5a" stroke-width="1.3" stroke-linejoin="round"/>
  <text x="600" y="342" font-size="11" fill="#3d3d3a" text-anchor="middle">earth</text>
  <path d="M80 192 H450" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <circle cx="80" cy="192" r="2.6" fill="#5f5e5a"/>
  <text x="88" y="208" font-size="11" fill="#2c2c2a" text-anchor="start" font-weight="bold">neutral point N</text>
  <line x1="210" y1="200" x2="210" y2="306" stroke="#0f6e56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="257" font-size="13" fill="#0f6e56" text-anchor="start">ΔU<tspan dy="3.9" font-size="9">0</tspan></text>
  <circle cx="300" cy="192" r="2.6" fill="#5f5e5a"/>
  <path d="M300 192 V222" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <rect x="286" y="222" width="28" height="46" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="0.8"/>
  <text x="322" y="250" font-size="12" fill="#3d3d3a" text-anchor="start">3·Y<tspan dy="3.6" font-size="9">0,net</tspan></text>
  <path d="M300 268 V312" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <circle cx="300" cy="312" r="2.6" fill="#5f5e5a"/>
  <text x="300" y="342" font-size="11" fill="#3d3d3a" text-anchor="middle">network without coils</text>
  <circle cx="450" cy="192" r="2.6" fill="#5f5e5a"/>
  <path d="M450 192 V216" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <ellipse cx="450" cy="206" rx="7" ry="3.85" fill="none" stroke="#0f6e56" stroke-width="1.6"/>
  <text x="464" y="210" font-size="12" fill="#0f6e56" text-anchor="start">I<tspan dy="3.6" font-size="9">coil</tspan></text>
  <path d="M450 220 a6 6 0 0 1 0 12 a6 6 0 0 1 0 12 a6 6 0 0 1 0 12 a6 6 0 0 1 0 12" fill="none" stroke="#2c2c2a" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M450 268 V312" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M450 216 H496 V230 M496 260 V274 H450" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <circle cx="496" cy="245" r="14" fill="#ffffff" stroke="#5f5e5a" stroke-width="1.3"/>
  <line x1="496" y1="236.6" x2="496" y2="253.4" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="516" y="249" font-size="12" fill="#993c1d" text-anchor="start">I<tspan dy="3.6" font-size="9">Nh</tspan></text>
  <circle cx="450" cy="312" r="2.6" fill="#5f5e5a"/>
  <text x="450" y="342" font-size="11" fill="#3d3d3a" text-anchor="middle">coils</text>
  <text x="40" y="374" font-size="13" fill="#3d3d3a" text-anchor="start">I<tspan dy="3.9" font-size="9">F,m</tspan><tspan dy="-3.9"> = 3·Y</tspan><tspan dy="3.9" font-size="9">0,net,m</tspan><tspan dy="-3.9">·ΔU</tspan><tspan dy="3.9" font-size="9">0,m</tspan><tspan dy="-3.9"> + ΔI</tspan><tspan dy="3.9" font-size="9">coil,m</tspan><tspan dy="-3.9">   (current law at the neutral point N)</tspan></text>
  <text x="40" y="398" font-size="12" fill="#3d3d3a" text-anchor="start">Y<tspan dy="3.6" font-size="9">0,net,m</tspan><tspan dy="-3.6"> = (I</tspan><tspan dy="3.6" font-size="9">F,m</tspan><tspan dy="-3.6"> − ΔI</tspan><tspan dy="3.6" font-size="9">coil,m</tspan><tspan dy="-3.6">)/(3·ΔU</tspan><tspan dy="3.6" font-size="9">0,m</tspan><tspan dy="-3.6">)   (staged fault test: I</tspan><tspan dy="3.6" font-size="9">F</tspan><tspan dy="-3.6"> measured)</tspan></text>
  <text x="40" y="420" font-size="12" fill="#3d3d3a" text-anchor="start">I<tspan dy="3.6" font-size="9">coil,m</tspan><tspan dy="-3.6"> ≈ U</tspan><tspan dy="3.6" font-size="9">0,m</tspan><tspan dy="-3.6">/(j·m·X</tspan><tspan dy="3.6" font-size="9">L</tspan><tspan dy="-3.6">) + I</tspan><tspan dy="3.6" font-size="9">Nh,m</tspan><tspan dy="-3.6">,   U</tspan><tspan dy="3.6" font-size="9">s,m</tspan><tspan dy="-3.6"> = Z</tspan><tspan dy="3.6" font-size="9">0,m</tspan><tspan dy="-3.6">·I</tspan><tspan dy="3.6" font-size="9">Nh,m</tspan><tspan dy="-3.6">/3</tspan></text>
  <text x="40" y="442" font-size="12" fill="#3d3d3a" text-anchor="start">Z<tspan dy="3.6" font-size="9">0,m</tspan><tspan dy="-3.6">/3 = 1/(3·Y</tspan><tspan dy="3.6" font-size="9">0,net,m</tspan><tspan dy="-3.6"> + 1/(j·m·X</tspan><tspan dy="3.6" font-size="9">L</tspan><tspan dy="-3.6">)) – in series with Z</tspan><tspan dy="3.6" font-size="9">F</tspan><tspan dy="-3.6">, Z</tspan><tspan dy="3.6" font-size="9">qL</tspan><tspan dy="-3.6"> and (Z</tspan><tspan dy="3.6" font-size="9">1</tspan><tspan dy="-3.6"> + Z</tspan><tspan dy="3.6" font-size="9">2</tspan><tspan dy="-3.6">)/3</tspan></text>
  <text x="40" y="466" font-size="11" fill="#2c2c2a" text-anchor="start">Limit cases: no coils and Y<tspan dy="3.3" font-size="8">0,net</tspan><tspan dy="-3.3"> → 0 ⇒ I</tspan><tspan dy="3.3" font-size="8">F</tspan><tspan dy="-3.3"> → 0 for every Z</tspan><tspan dy="3.3" font-size="8">F</tspan><tspan dy="-3.3">;   Z</tspan><tspan dy="3.3" font-size="8">F</tspan><tspan dy="-3.3"> → ∞ ⇒ I</tspan><tspan dy="3.3" font-size="8">F</tspan><tspan dy="-3.3"> → 0;</tspan></text>
  <text x="40" y="482" font-size="11" fill="#2c2c2a" text-anchor="start">Z<tspan dy="3.3" font-size="8">1</tspan><tspan dy="-3.3">, Z</tspan><tspan dy="3.3" font-size="8">2</tspan><tspan dy="-3.3">, Z</tspan><tspan dy="3.3" font-size="8">qL</tspan><tspan dy="-3.3">, Z</tspan><tspan dy="3.3" font-size="8">F</tspan><tspan dy="-3.3"> → 0 ⇒ ΔU</tspan><tspan dy="3.3" font-size="8">0</tspan><tspan dy="-3.3"> = U</tspan><tspan dy="3.3" font-size="8">q</tspan><tspan dy="-3.3"> (full displacement), I</tspan><tspan dy="3.3" font-size="8">F</tspan><tspan dy="-3.3"> = (3·Y</tspan><tspan dy="3.3" font-size="8">0,net</tspan><tspan dy="-3.3"> + 1/(j·m·X</tspan><tspan dy="3.3" font-size="8">L</tspan><tspan dy="-3.3">))·U</tspan><tspan dy="3.3" font-size="8">q</tspan></text>
  <text x="40" y="506" font-size="11" fill="#3d3d3a" text-anchor="start">orientation of the angle method: the active part of I<tspan dy="3.3" font-size="8">F</tspan><tspan dy="-3.3"> is in phase with U</tspan><tspan dy="3.3" font-size="8">0</tspan><tspan dy="-3.3">; every coil current lags U</tspan><tspan dy="3.3" font-size="8">0</tspan><tspan dy="-3.3"> at 50 Hz</tspan></text>
</svg>
