<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Measuring points for the network model</title>
  <desc>Single-line diagram of a substation: HV/MV transformer with current transformers on the MV side, Petersen coil at the transformer star point with its current transformer, MV busbar with line-to-earth voltage transformers, feeders with core-balance current transformers, a power-quality measurement at the same busbar and, for a staged fault test in the network, a second synchronised recorder at the fault location.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3d3d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="470" fill="#ffffff"/>
  <line x1="170" y1="40" x2="330" y2="40" stroke="#2c2c2a" stroke-width="3.5"/>
  <text x="160" y="44" font-size="12" fill="#2c2c2a" text-anchor="end">HV busbar</text>
  <text x="340" y="44" font-size="11" fill="#0f6e56" text-anchor="start">U<tspan dy="3.3" font-size="8">HV</tspan><tspan dy="-3.3"> (may)</tspan></text>
  <path d="M240 40 V58" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <circle cx="240" cy="74" r="16" fill="none" stroke="#5f5e5a" stroke-width="1.4"/>
  <circle cx="240" cy="96" r="16" fill="none" stroke="#5f5e5a" stroke-width="1.4"/>
  <text x="266" y="90" font-size="12" fill="#3d3d3a" text-anchor="start">HV/MV transformer</text>
  <path d="M240 112 V176" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <ellipse cx="240" cy="146" rx="7" ry="3.85" fill="none" stroke="#0f6e56" stroke-width="1.6"/>
  <text x="254" y="150" font-size="11" fill="#0f6e56" text-anchor="start">I<tspan dy="3.3" font-size="8">L1</tspan><tspan dy="-3.3">, I</tspan><tspan dy="3.3" font-size="8">L2</tspan><tspan dy="-3.3">, I</tspan><tspan dy="3.3" font-size="8">L3</tspan><tspan dy="-3.3"> (should)</tspan></text>
  <path d="M224 96 H110 V190" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <ellipse cx="110" cy="198" rx="7" ry="3.85" fill="none" stroke="#0f6e56" stroke-width="1.6"/>
  <path d="M110 208 a6 6 0 0 1 0 12 a6 6 0 0 1 0 12 a6 6 0 0 1 0 12 a6 6 0 0 1 0 12" fill="none" stroke="#2c2c2a" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M110 256 V268" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M99 272 H121 M103 276 H117 M107 280 H113" fill="none" stroke="#5f5e5a" stroke-width="1.3" stroke-linejoin="round"/>
  <text x="124" y="202" font-size="11" fill="#0f6e56" text-anchor="start">I<tspan dy="3.3" font-size="8">coil</tspan><tspan dy="-3.3"> of every coil (must)</tspan></text>
  <text x="124" y="240" font-size="11" fill="#3d3d3a" text-anchor="start">Petersen coil(s)</text>
  <line x1="170" y1="176" x2="740" y2="176" stroke="#2c2c2a" stroke-width="3.5"/>
  <text x="740" y="168" font-size="12" fill="#2c2c2a" text-anchor="end">MV busbar</text>
  <path d="M380 176 V196" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <circle cx="380" cy="208" r="12" fill="none" stroke="#5f5e5a" stroke-width="1.4"/>
  <circle cx="380" cy="224" r="12" fill="none" stroke="#5f5e5a" stroke-width="1.4"/>
  <path d="M380 236 V246" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M369 250 H391 M373 254 H387 M377 258 H383" fill="none" stroke="#5f5e5a" stroke-width="1.3" stroke-linejoin="round"/>
  <text x="398" y="212" font-size="11" fill="#0f6e56" text-anchor="start">U<tspan dy="3.3" font-size="8">L1E</tspan><tspan dy="-3.3">, U</tspan><tspan dy="3.3" font-size="8">L2E</tspan><tspan dy="-3.3">, U</tspan><tspan dy="3.3" font-size="8">L3E</tspan><tspan dy="-3.3"> (must)</tspan></text>
  <text x="398" y="230" font-size="11" fill="#0f6e56" text-anchor="start">U<tspan dy="3.3" font-size="8">NE</tspan><tspan dy="-3.3"> (may)</tspan></text>
  <path d="M600 176 V250" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <ellipse cx="600" cy="206" rx="7" ry="3.85" fill="none" stroke="#0f6e56" stroke-width="1.6"/>
  <path d="M660 176 V250" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <ellipse cx="660" cy="206" rx="7" ry="3.85" fill="none" stroke="#0f6e56" stroke-width="1.6"/>
  <path d="M720 176 V250" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <ellipse cx="720" cy="206" rx="7" ry="3.85" fill="none" stroke="#0f6e56" stroke-width="1.6"/>
  <text x="710" y="270" font-size="11" fill="#0f6e56" text-anchor="end">feeders: 3I<tspan dy="3.3" font-size="8">0</tspan><tspan dy="-3.3"> of every feeder (may)</tspan></text>
  <path d="M720 250 V300" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-linejoin="round"/>
  <rect x="706" y="300" width="28" height="30" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="720" y="320" font-size="12" fill="#3d3d3a" text-anchor="middle" font-weight="bold">F</text>
  <text x="696" y="312" font-size="11" fill="#2c2c2a" text-anchor="end">fault location in the network</text>
  <text x="696" y="328" font-size="11" fill="#0f6e56" text-anchor="end">recorder: I<tspan dy="3.3" font-size="8">F</tspan><tspan dy="-3.3">, U</tspan><tspan dy="3.3" font-size="8">E</tspan><tspan dy="-3.3">, GPS (test in the network)</tspan></text>
  <rect x="300" y="362" width="260" height="70" rx="4" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
  <text x="430" y="384" font-size="13" fill="#0f6e56" text-anchor="middle" font-weight="bold">disturbance recorder</text>
  <text x="430" y="404" font-size="11" fill="#0f6e56" text-anchor="middle">≥ 10 kHz · ≥ 16 bit · COMTRADE</text>
  <text x="430" y="421" font-size="11" fill="#0f6e56" text-anchor="middle">all green channels, one time base (GPS)</text>
  <rect x="40" y="362" width="230" height="70" rx="4" fill="#faeeda" stroke="#854f0b" stroke-width="0.8"/>
  <text x="155" y="384" font-size="12" fill="#854f0b" text-anchor="middle" font-weight="bold">power-quality measurement</text>
  <text x="155" y="404" font-size="11" fill="#854f0b" text-anchor="middle">U<tspan dy="3.3" font-size="8">m</tspan><tspan dy="-3.3"> per phase L-E (must)</tspan></text>
  <text x="155" y="421" font-size="11" fill="#854f0b" text-anchor="middle">10-min values, 95 % quantiles</text>
  <text x="20" y="458" font-size="11" fill="#3d3d3a" text-anchor="start">green: disturbance recorder · orange: power-quality measurement · must/should/may: requirement for the network model</text>
</svg>
